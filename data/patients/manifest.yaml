# Verification gates
gates:
  source_verification:
    - Official URL or DOI
    - Publisher and release date
    - Dataset type classification
  license_verification:
    - Explicit reuse terms
    - Research and derivative creation permitted
    - No commercial-only or ND restrictions
  deidentification_verification:
    - Public-use or de-identified status confirmed
    - No SEQN, record IDs, or source identifiers
    - No PII/PHI fields
  schema_verification:
    - Normalized to t2dm_profile_v1
    - Required fields present
    - T2DM purity (no type-1)
  transformation_traceability:
    - Reproducible pipeline script
    - Version tracked
    - Base data documented

# Usage policy
usage:
  generator_access: Only datasets with enabled=true
  eval_benchmark: Must use synthetic profiles only
  demo_seed: Must use synthetic or enabled datasets only
  fail_closed: Generator/tests fail if manifest missing or source quarantined
