name: Structure & Data Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kiểm tra cấu trúc repo theo template AI20K
        run: python scripts/check_structure.py

      - name: Kiểm tra dữ liệu seed có nguồn đầy đủ
        run: python scripts/validate_data.py
