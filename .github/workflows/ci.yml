name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore: [docs/**, web-next/**, "*.md"]
  pull_request:
    branches: [main]
    paths-ignore: [docs/**, web-next/**, "*.md"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Check formatting with ruff
        run: ruff format --check src/ tests/ scripts/

      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ github.ref }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-
            mypy-${{ runner.os }}-

      - name: Type check with mypy
        run: mypy src/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

  docker-build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nutricare-agent:ci .

  structure:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kiểm tra cấu trúc repo theo template AI20K
        run: python scripts/check_structure.py

      - name: Kiểm tra dữ liệu seed có nguồn đầy đủ
        run: python scripts/validate_data.py
